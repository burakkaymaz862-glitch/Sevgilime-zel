<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bizim Hikayemiz</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #000; color: #fff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    
    /* Şifre Ekranı */
    #passcode-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; height: 100vh; }
    .lock-icon { font-size: 32px; margin-bottom: 20px; }
    .passcode-title { font-size: 18px; margin-bottom: 30px; letter-spacing: 1px; }
    .dots { display: flex; gap: 15px; margin-bottom: 40px; }
    .dot { width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid #fff; }
    .dot.filled { background-color: #fff; }
    .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; width: 280px; }
    .key { width: 70px; height: 70px; border-radius: 50%; background: rgba(255, 255, 255, 0.1); border: none; color: #fff; font-size: 24px; display: flex; align-items: center; justify-content: center; cursor: pointer; margin: auto; }
    .key:active { background: rgba(255, 255, 255, 0.3); }

    /* Ana İçerik */
    #main-content { display: none; width: 100%; max-width: 500px; padding: 20px; text-align: center; }
    .timer-card { background: #1c1c1e; padding: 20px; border-radius: 16px; margin-bottom: 25px; }
    .timer-title { color: #8e8e93; font-size: 14px; margin-bottom: 10px; text-transform: uppercase; }
    .timer-display { font-size: 22px; font-weight: bold; color: #ff2d55; }
    
    /* Fotoğraf Yükleme & Galeri */
    .upload-section { background: #1c1c1e; padding: 20px; border-radius: 16px; margin-bottom: 25px; border: 1px dashed #48484a; }
    .upload-btn { background: #ff2d55; color: white; padding: 10px 20px; border-radius: 20px; cursor: pointer; font-weight: 600; display: inline-block; margin-top: 10px; }
    input[type="file"] { display: none; }
    
    .gallery { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin-top: 20px; }
    .gallery-item { width: 100%; height: 200px; border-radius: 12px; object-fit: cover; background: #2c2c2e; }
  </style>
</head>
<body>

  <!-- 1. ŞİFRE EKRANI -->
  <div id="passcode-screen">
    <div class="lock-icon">🔒</div>
    <div class="passcode-title">Parolayı Girin</div>
    <div class="dots">
      <div class="dot" id="dot-0"></div>
      <div class="dot" id="dot-1"></div>
      <div class="dot" id="dot-2"></div>
      <div class="dot" id="dot-3"></div>
    </div>
    <div class="keypad">
      <button class="key" onclick="pressKey('1')">1</button>
      <button class="key" onclick="pressKey('2')">2</button>
      <button class="key" onclick="pressKey('3')">3</button>
      <button class="key" onclick="pressKey('4')">4</button>
      <button class="key" onclick="pressKey('5')">5</button>
      <button class="key" onclick="pressKey('6')">6</button>
      <button class="key" onclick="pressKey('7')">7</button>
      <button class="key" onclick="pressKey('8')">8</button>
      <button class="key" onclick="pressKey('9')">9</button>
      <button class="key" style="grid-column: 2" onclick="pressKey('0')">0</button>
    </div>
  </div>

  <!-- 2. ANA SİTE İÇERİĞİ -->
  <div id="main-content">
    <h1 style="margin-bottom: 20px; color: #ff2d55;">Seni Çok Seviyorum ❤️</h1>
    
    <div class="timer-card">
      <div class="timer-title">Birlikte Geçen Süre</div>
      <div class="timer-display" id="timer">Yükleniyor...</div>
    </div>

    <!-- Fotoğraf Ekleme Alanı -->
    <div class="upload-section">
      <p style="color: #8e8e93; font-size: 14px;">Anılarımızı eklemek için fotoğrafları seç:</p>
      <label class="upload-btn">
        📷 Fotoğraf Seç / Yükle
        <input type="file" id="photo-input" multiple accept="image/*" onchange="uploadPhotos(event)">
      </label>
    </div>

    <!-- Galeri -->
    <div class="gallery" id="gallery"></div>
  </div>

  <script>
    // Şifre Ayarı (0905)
    const CORRECT_CODE = "0905";
    let enteredCode = "";

    function pressKey(num) {
      if (enteredCode.length < 4) {
        enteredCode += num;
        updateDots();
        if (enteredCode.length === 4) {
          setTimeout(checkCode, 200);
        }
      }
    }

    function updateDots() {
      for (let i = 0; i < 4; i++) {
        const dot = document.getElementById(`dot-${i}`);
        if (i < enteredCode.length) {
          dot.classList.add('filled');
        } else {
          dot.classList.remove('filled');
        }
      }
    }

    function checkCode() {
      if (enteredCode === CORRECT_CODE) {
        document.getElementById('passcode-screen').style.display = 'none';
        document.getElementById('main-content').style.display = 'block';
        startTimer();
      } else {
        alert("Hatalı Şifre!");
        enteredCode = "";
        updateDots();
      }
    }

    // Sayaç (05 Mayıs 2024 varsayılan)
    function startTimer() {
      const startDate = new Date("2024-05-05T00:00:00");
      setInterval(() => {
        const now = new Date();
        const diff = now - startDate;
        
        const days = Math.floor(diff / (1000 * 60 * 60 * 24));
        const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
        const mins = Math.floor((diff / 1000 / 60) % 60);
        const secs = Math.floor((diff / 1000) % 60);

        document.getElementById('timer').innerText = `${days} Gün ${hours} Saat ${mins} Dk ${secs} Sn`;
      }, 1000);
    }

    // Fotoğraf Yükleme Fonksiyonu
    function uploadPhotos(event) {
      const files = event.target.files;
      const gallery = document.getElementById('gallery');
      
      for (let file of files) {
        const reader = new FileReader();
        reader.onload = function(e) {
          const img = document.createElement('img');
          img.src = e.target.result;
          img.className = 'gallery-item';
          gallery.appendChild(img);
        }
        reader.readAsDataURL(file);
      }
    }
  </script>
</body>
</html>
